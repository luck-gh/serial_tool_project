name: Serial Tool Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - '[vV]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, for example V1.2.6 or v1.2.6'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release_tools

      - name: Select release tag
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must be vX.Y.Z or VX.Y.Z' >&2
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: serial_tool_project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate release versions
        id: validate
        shell: bash
        working-directory: serial_tool_project
        run: |
          python ../release_tools/.github/scripts/validate_serial_tool_release.py \
            "$RELEASE_TAG" \
            README.md \
            version_info.py | tee version-output.txt
          cat version-output.txt >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select historical firmware dependency
        id: dependencies
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.tag_version }}
        run: |
          # 历史版本分别使用已核对对话框/下载核心接口的配套提交.
          case "$RELEASE_VERSION" in
            1.2.3) echo 'firmware_ref=1628cb6a9ccb45e457e6987f736d22bc5bf27e13' >> "$GITHUB_OUTPUT" ;;
            1.2.4|1.2.5) echo 'firmware_ref=0ca6a331dbb5d06aeb834c5592ee480eac318121' >> "$GITHUB_OUTPUT" ;;
            1.2.6) echo 'firmware_ref=b187b587d92d5c30ae45077c61ec770fa352ff14' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout number converter project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/number_converter_project
          path: number_converter_project

      - name: Checkout bin hex converter project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bin_hex_converter_project
          path: bin_hex_converter_project

      - name: Checkout firmware downloader project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/firmware_downloader_project
          ref: ${{ steps.dependencies.outputs.firmware_ref }}
          path: firmware_downloader_project

      - name: Record build source commits
        shell: bash
        run: |
          for project in serial_tool_project number_converter_project bin_hex_converter_project firmware_downloader_project; do
            echo "$project=$(git -C "$project" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Install build dependencies
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.tag_version }}
        run: |
          python -m pip install --upgrade pip
          # 这三个原标签尚无 requirements.txt,显式沿用其原发布依赖.
          case "$RELEASE_VERSION" in
            1.2.3|1.2.4|1.2.5) python -m pip install PyQt5 pyserial pyinstaller ;;
            *) python -m pip install -r serial_tool_project/requirements.txt pyinstaller ;;
          esac

      - name: Build exe with PyInstaller
        shell: bash
        working-directory: serial_tool_project
        run: |
          python -m PyInstaller --clean main.spec

      - name: Add version to release file names
        shell: bash
        working-directory: serial_tool_project
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.tag_version }}
        run: |
          mv "dist/GHowe_串口调试助手.exe" "dist/GHowe_串口调试助手_v${RELEASE_VERSION}.exe"
          mv "dist/GHowe_串口调试助手_GUI.exe" "dist/GHowe_串口调试助手_GUI_v${RELEASE_VERSION}.exe"
          mv "dist/GHowe_串口调试助手_CLI.exe" "dist/GHowe_串口调试助手_CLI_v${RELEASE_VERSION}.exe"

      - name: Verify exe files exist
        shell: bash
        working-directory: serial_tool_project
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.tag_version }}
        run: |
          test -s "dist/GHowe_串口调试助手_v${RELEASE_VERSION}.exe"
          test -s "dist/GHowe_串口调试助手_GUI_v${RELEASE_VERSION}.exe"
          test -s "dist/GHowe_串口调试助手_CLI_v${RELEASE_VERSION}.exe"

      - name: Prepare release notes from tagged commit
        shell: bash
        working-directory: serial_tool_project
        run: git log -1 --pretty=%B HEAD > ../release-notes.md

      - name: Smoke test packaged CLI entry points
        timeout-minutes: 2
        shell: pwsh
        working-directory: serial_tool_project
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.tag_version }}
        run: |
          # 旧CLI在runner重定向管道使用cp1252,中文帮助须在真实Windows控制台输出.
          $checks = @(
            @{ File = ".\dist\GHowe_串口调试助手_CLI_v$env:RELEASE_VERSION.exe"; Arguments = @('--help') },
            @{ File = ".\dist\GHowe_串口调试助手_v$env:RELEASE_VERSION.exe"; Arguments = @('--cli', '--help') }
          )
          foreach ($check in $checks) {
            $process = Start-Process -FilePath $check.File -ArgumentList $check.Arguments -WindowStyle Hidden -PassThru
            try {
              if (-not $process.WaitForExit(45000)) {
                $process.Kill($true)
                if (-not $process.WaitForExit(5000)) { throw "Smoke process cleanup timed out: $($check.File)" }
                throw "--help timed out: $($check.File)"
              }
              if ($process.ExitCode -ne 0) { throw "--help failed with exit $($process.ExitCode): $($check.File)" }
              Write-Host "--help passed: $($check.File)"
            } finally {
              $process.Dispose()
            }
          }

      - name: Refuse to overwrite an existing release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: process.env.RELEASE_TAG,
              });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            throw new Error(`Release ${process.env.RELEASE_TAG} already exists; refusing to overwrite it`);

      - name: Create GitHub Release and upload exe files
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.validate.outputs.source_sha }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          make_latest: legacy
          draft: false
          prerelease: false
          files: |
            serial_tool_project/dist/GHowe_串口调试助手_v${{ steps.validate.outputs.tag_version }}.exe
            serial_tool_project/dist/GHowe_串口调试助手_GUI_v${{ steps.validate.outputs.tag_version }}.exe
            serial_tool_project/dist/GHowe_串口调试助手_CLI_v${{ steps.validate.outputs.tag_version }}.exe
