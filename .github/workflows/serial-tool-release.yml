name: Serial Tool Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: serial_tool_project

      - name: Checkout number converter project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/number_converter_project
          path: number_converter_project

      - name: Checkout bin hex converter project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bin_hex_converter_project
          path: bin_hex_converter_project

      - name: Checkout firmware downloader project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/firmware_downloader_project
          path: firmware_downloader_project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate release versions
        id: validate
        shell: bash
        working-directory: serial_tool_project
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          python .github/scripts/validate_serial_tool_release.py \
            "$TAG_NAME" \
            README.md \
            version_info.py | tee version-output.txt
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < version-output.txt

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyserial pyinstaller

      - name: Build exe with PyInstaller
        shell: bash
        working-directory: serial_tool_project
        run: |
          pyinstaller --clean main.spec

      - name: Verify exe files exist
        shell: bash
        working-directory: serial_tool_project
        run: |
          test -f "dist/GHowe_串口调试助手.exe"
          test -f "dist/GHowe_串口调试助手_GUI.exe"
          test -f "dist/GHowe_串口调试助手_CLI.exe"

      - name: Prepare release notes from tagged commit
        shell: bash
        working-directory: serial_tool_project
        run: git log -1 --pretty=%B "${GITHUB_SHA}^{commit}" > ../release-notes.md

      - name: Create GitHub Release and upload exe files
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            serial_tool_project/dist/GHowe_串口调试助手.exe
            serial_tool_project/dist/GHowe_串口调试助手_GUI.exe
            serial_tool_project/dist/GHowe_串口调试助手_CLI.exe
